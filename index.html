<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentica</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<link rel="alternate" hreflang="de" href="https://agentica.ch/de/">
<link rel="alternate" hreflang="en" href="https://agentica.ch/en/">
<link rel="alternate" hreflang="x-default" href="https://agentica.ch/de/">
<script>
// Gemerkte Wahl, sonst erste Browsersprache aus de/en, sonst Deutsch.
(function () {
  var LANGS = ['de', 'en'], stored = null;
  try { stored = localStorage.getItem('agentica-lang'); } catch (e) { /* Speicher gesperrt: Browsersprache entscheidet */ }
  var browser = (navigator.languages || [navigator.language || '']).map(function (l) { return l.slice(0, 2).toLowerCase(); });
  var pick = LANGS.indexOf(stored) >= 0 ? stored : (browser.filter(function (l) { return LANGS.indexOf(l) >= 0; })[0] || 'de');
  location.replace('/' + pick + '/');
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/de/"></noscript>
</head>
<body>
<p><a href="/de/">Deutsch</a> · <a href="/en/">English</a></p>
</body>
</html>
